<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href= "/components/navbar.css">
    <link rel="stylesheet" href= "/css/styles_login.css" >
    <script defer src="/scripts/auth-fetch.js"></script>
    <script defer src="/components/navbar.js"></script>
    <!-- Supabase JS is only loaded on this one page: completing a password-reset recovery link
         needs to happen directly against Supabase Auth (it reads the recovery token straight out
         of the URL fragment), so this is the one legitimate spot for a client-side Supabase client
         in an app that otherwise always talks to Supabase through the Express backend. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="/scripts/reset_password.js"></script>
</head>

<body>
    <header>
    </header>

    <form id="resetPasswordForm">
        <h2>Reset Password</h2>
        <p id="resetPasswordHint" class="form-hint">Checking your reset link...</p>

        <p id="resetPasswordError" class="form-error" hidden></p>
        <p id="resetPasswordSuccess" class="form-success" hidden></p>

        <label for="new_password">New password:</label>
        <input type="password" id="new_password" name="new_password" required autocomplete="new-password" disabled>

        <label for="confirm_password">Confirm new password:</label>
        <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" disabled>

        <button type="submit" id="resetPasswordSubmitBtn" disabled>Set new password</button>

        <p class="form-links"><a href="/login.html">Back to login</a></p>
    </form>

    <footer>
    </footer>
</body>
</html>
