<html>
    <body>
        <head>
            <div class="navbar">

                    <a href="index.html">
                        <img src="/images/logo.png" alt="Logo" class="logo">

                </div>
                <div class="navbar-right">
                    <div class="home-icon" onclick="menuHomeRedirect()">&#8962;</div>
                    <div class="reviews-alert-icon" id="reviewsAlertIcon" style="display:none;" onclick="handleReviewsAlertClick()" role="button" tabindex="0" aria-label="Pending reviews" title="You have stays waiting for a review">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>

                    <!--<div class="user-icon" onclick="toggleMenu()">&#128100;</div>-->

                        <!-- Wrap the image and name inside a flex container -->

                            <img class="user-session-profile-pic" alt="User Profile">
                        </div>
                    </div>
                    <!--<div class="menu-icon" onclick="toggleMenu()">&#9776;</div>-->
                </div>                
                <div class="dropdown-menu" id="menu">
                    <a href="login.html" id="menu-login">Log in</a>
                    <a href="login_new.html" id="menu-signup">Sign up</a>
                    <a href="user_profile.html" id="menu-profile">Profile</a>
                    <a href="#" id="menu-logout" onclick="logout()">Logout</a>
                </div>
            </div>
        </head>
        <script src="/scripts/navbar.js"></script>
