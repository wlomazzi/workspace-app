<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User Profile</title>
    <link rel="stylesheet" href="/css/styles_user_profile_update.css">
    <link rel="stylesheet" href="/components/navbar.css">
    <link rel="stylesheet" href="/components/footer.css">
    <script defer src="/scripts/auth-fetch.js"></script>
    <script defer src="/components/navbar.js"></script>
    <script defer src="/components/footer.js"></script>
</head>
<body>
    <div class="profile-update-container">
        <!-- User Information Section -->
        <div class="user-info">
            <img src="/images/user_default.png" alt="Profile Picture" class="profile-pic" id="profile-pic">
            <input type="file" id="fileInput" style="display: none;" />

            <div class="user-details">
                <label for="firstName">Full Name:</label>
                <input type="text" id="user-fullName" name="fullName">
                
                <label for="email">Phone number:</label>
                <input type="text" id="user-phone" placeholder="(999) 999-9999" />
                
                <label for="email">Email:</label>
                <input type="email" id="user-email" name="email">
                
                <label for="location">Location:</label>
                <input type="text" id="user-location" name="location">
                
                <!-- Line after Location field -->
                <hr>
                <!-- Owner and Coworker selection -->
                <div class="role-selection">
                    <label>
                        <input type="checkbox" id="is_coworker" name="is_coworker">
                        <span>Coworker</span>
                    </label>
                    <label>
                        <input type="checkbox" id="is_owner" name="is_owner">
                        <span>Owner</span>
                    </label>
                </div>

                <!-- Message below checkboxes -->
                <div id="message" style="margin-top: 20px; color: #ff00009a;"></div>

                <button class="update-btn" id="updateProfile">Update Profile</button>

                <!-- Change Password section -->
                <hr>
                <button type="button" class="security-toggle-btn" id="togglePasswordSection" aria-expanded="false">
                    <span>Change Password</span>
                    <svg class="security-toggle-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m6 9 6 6 6-6"></path>
                    </svg>
                </button>

                <div class="password-section" id="passwordSection" hidden>
                    <label for="current-password">Current Password:</label>
                    <input type="password" id="current-password" autocomplete="current-password">

                    <label for="new-password">New Password:</label>
                    <input type="password" id="new-password" autocomplete="new-password" minlength="6">

                    <label for="confirm-new-password">Confirm New Password:</label>
                    <input type="password" id="confirm-new-password" autocomplete="new-password" minlength="6">

                    <div id="passwordMessage" class="password-message" hidden></div>

                    <button class="update-btn password-update-btn" id="updatePassword">Update Password</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/scripts/user_profile_update.js"></script>
</body>
</html>
