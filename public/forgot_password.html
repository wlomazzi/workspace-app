<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href= "/components/navbar.css">
    <link rel="stylesheet" href= "/css/styles_login.css" >
    <script defer src="/scripts/auth-fetch.js"></script>
    <script defer src="/components/navbar.js"></script>
    <script defer src="/scripts/forgot_password.js"></script>
</head>

<body>
    <header>
    </header>

    <form id="forgotPasswordForm">
        <h2>Forgot Password</h2>
        <p class="form-hint">Enter the email you used to sign up and we'll send you a link to reset your password.</p>

        <p id="forgotPasswordError" class="form-error" hidden></p>
        <p id="forgotPasswordSuccess" class="form-success" hidden></p>

        <label for="user_email">Email:</label>
        <input type="email" id="user_email" name="user_email" required autocomplete="email">

        <button type="submit" id="forgotPasswordSubmitBtn">Send reset link</button>

        <p class="form-links"><a href="/login.html">Back to login</a></p>
    </form>

    <footer>
    </footer>
</body>
</html>
